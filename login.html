<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">

    <title>CG Login</title>
</head>

<body>

    <!-- login side -->

    <div id="box" class="box1">
        <div id="right-container">
            <div id="right-heading">
                <h1>Hello, Friend!</h1>
                <p>Enter your personal details and <br>start journey withus</p>
                <button class="btnsignup">Sign Up</button>
            </div>
        </div>
        <div id="container">
            <div id="heading">
                <h1>Login</h1>
                <p>Welcome Back please login to your account..</p>
                
            </div>

            <form action="">
                <input type="text" name="" id="" class="area" placeholder="User name...">
                <input type="password" name="" id="" class="area" placeholder="Enter password...  ">
                <p class="checkbox"><input type="checkbox" name="" >Remember me</p>
                <input type="submit" value="Login" id="login">
            </form>
            <!-- <div id="signin">
                <p class="bottomtext">Don't have an account?<b id="register">Register</b> </p>
            </div> -->
        </div>
    </div>

    <div id="box" class="box2">
        <div id="container2">
            <div id="heading">
                <h1>Sign up</h1>
                <p>Create your new account</p>
            </div>

            <form action="">
                <input type="text" name="" id="" class="area" placeholder="First name">
                <input type="text" name="" id="" class="area" placeholder="Last name">
                <input type="email" name="" id="" class="area" placeholder="Email">
                <input type="password" name="" id="" class="area" placeholder="Enter password">
                <p class="checkbox"><input type="checkbox" name="" >Remember me</p>
                <input type="submit" value="Register" id="login">
            </form>
            <!-- <div id="signin">
                <p class="bottomtext">Already have an account..<b class="login">Login</b> </p>
            </div> -->
        </div>
        <div id="left-container">
            <div id="left-heading">
                <h1>Welcome Back!</h1>
                <p>To keep connected with us please login <br> with your personal info </p>
                <button class="btnsignin">Sign In</button>
            </div>
        </div>

        <script src="login.js"></script>
</body>

</html>
